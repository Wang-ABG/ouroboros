<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f0eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>起点书坊</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="default">

<!-- ====== 书架页 ====== -->
<div id="page-bookshelf" class="page active">
  <header class="app-header">
    <div class="header-left">
      <h1>书架</h1>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="toggleBookshelfSearch()" id="search-toggle-btn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="icon-btn import-trigger" onclick="importFile()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <div class="search-bar-wrap" id="search-bar-wrap">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="book-search-input" placeholder="搜索书名..." oninput="onBookSearch(this.value)">
      <button class="search-clear" onclick="clearBookSearch()" style="display:none">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <main class="bookshelf-main" id="bookshelf-main">
    <!-- 继续阅读 -->
    <section class="continue-section" id="continue-section" style="display:none">
      <div class="section-title-row">
        <span class="section-title">继续阅读</span>
      </div>
      <div class="continue-card" id="continue-card" onclick="continueReading()">
        <div class="continue-cover" id="continue-cover"></div>
        <div class="continue-info">
          <div class="continue-title" id="continue-title"></div>
          <div class="continue-chapter" id="continue-chapter"></div>
          <div class="continue-progress">
            <div class="continue-progress-bar"><div class="continue-progress-fill" id="continue-progress-fill"></div></div>
            <span class="continue-percent" id="continue-percent"></span>
          </div>
        </div>
        <div class="continue-play">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
    </section>

    <!-- 阅读统计 -->
    <section class="stats-section" id="stats-section" style="display:none">
      <div class="stats-card">
        <div class="stat-item">
          <div class="stat-num" id="stat-books">0</div>
          <div class="stat-label">藏书</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <div class="stat-num" id="stat-chapters">0</div>
          <div class="stat-label">已读章节</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <div class="stat-num" id="stat-time">0h</div>
          <div class="stat-label">阅读时长</div>
        </div>
      </div>
    </section>

    <!-- 书架网格 -->
    <section class="shelf-section">
      <div class="section-title-row">
        <span class="section-title">全部图书</span>
        <span class="section-count" id="book-count">0 本</span>
      </div>
      <div id="bookshelf-grid" class="bookshelf-grid"></div>
    </section>

    <!-- 空状态 -->
    <div id="empty-state" class="empty-state">
      <div class="empty-illustration">
        <svg viewBox="0 0 120 120" width="100" height="100">
          <rect x="20" y="30" width="35" height="65" rx="4" fill="var(--accent)" opacity="0.15"/>
          <rect x="22" y="32" width="31" height="61" rx="3" fill="var(--accent)" opacity="0.3"/>
          <rect x="60" y="35" width="38" height="60" rx="4" fill="var(--accent)" opacity="0.2"/>
          <rect x="62" y="37" width="34" height="56" rx="3" fill="var(--accent)" opacity="0.4"/>
          <path d="M30 50 L48 50 M30 56 L44 56 M30 62 L46 62" stroke="var(--accent)" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
          <path d="M70 55 L88 55 M70 61 L84 61 M70 67 L86 67" stroke="var(--accent)" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="empty-title">书架空空如也</p>
      <p class="empty-hint">导入 TXT / EPUB 小说开始阅读</p>
      <button class="import-btn" onclick="importFile()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        导入小说
      </button>
    </div>
  </main>
  <input type="file" id="file-input" accept=".txt,.epub,text/plain,application/epub+zip" style="display:none">
</div>

<!-- ====== 阅读页 ====== -->
<div id="page-reader" class="page">
  <header class="reader-header" id="reader-header">
    <button class="icon-btn" onclick="backToBookshelf()">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="reader-title-wrap">
      <div class="reader-title" id="reader-title">书名</div>
      <div class="reader-subtitle" id="reader-subtitle"></div>
    </div>
    <button class="icon-btn" onclick="toggleNightMode()" id="night-btn">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" id="night-icon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>
  <main class="reader-main" id="reader-main">
    <div class="reader-inner" id="reader-inner">
      <div class="chapter-meta" id="chapter-meta">第 1 章 / 共 1 章</div>
      <h2 class="chapter-title" id="chapter-title">章节标题</h2>
      <div class="novel-content" id="novel-content"></div>
      <div class="chapter-end" id="chapter-end">
        <div class="end-divider"><span class="end-line"></span><span class="end-text">本章已读完</span><span class="end-line"></span></div>
        <div class="end-actions">
          <button class="end-btn" onclick="prevChapter()">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
            上一章
          </button>
          <button class="end-btn primary" onclick="nextChapter()">
            下一章
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
  <footer class="reader-footer" id="reader-footer">
    <div class="progress-bar" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="progress-info">
      <span id="progress-text">0%</span>
      <span id="chapter-info-text">第 1 章</span>
    </div>
    <div class="footer-actions">
      <button class="footer-btn" onclick="prevChapter()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        <span class="footer-label">上一章</span>
      </button>
      <button class="footer-btn" onclick="toggleTOC()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        <span class="footer-label">目录</span>
      </button>
      <button class="footer-btn" onclick="toggleComments()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="footer-label">本章说</span>
      </button>
      <button class="footer-btn" onclick="toggleSettings()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="footer-label">设置</span>
      </button>
      <button class="footer-btn" onclick="nextChapter()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        <span class="footer-label">下一章</span>
      </button>
    </div>
  </footer>
</div>

<!-- 遮罩 -->
<div class="overlay" id="overlay" onclick="closeAllPanels()"></div>

<!-- 目录面板 -->
<div class="side-panel left" id="toc-panel">
  <div class="panel-header">
    <h3>目录</h3>
    <button class="icon-btn" onclick="closeAllPanels()">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="panel-body" id="toc-body"></div>
</div>

<!-- 设置面板 -->
<div class="side-panel right" id="settings-panel">
  <div class="panel-header">
    <h3>阅读设置</h3>
    <button class="icon-btn" onclick="closeAllPanels()">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <div class="settings-section">
      <div class="settings-label">阅读主题</div>
      <div class="theme-grid">
        <div class="theme-option active" data-theme="default" onclick="setTheme('default')"><div class="theme-preview" style="background:#faf8f5;color:#333;border-color:#e8e0d8">A</div><span>默认</span></div>
        <div class="theme-option" data-theme="night" onclick="setTheme('night')"><div class="theme-preview" style="background:#1a1a1e;color:#c8c8c8;border-color:#3a3a3e">A</div><span>夜间</span></div>
        <div class="theme-option" data-theme="eye" onclick="setTheme('eye')"><div class="theme-preview" style="background:#c7edcc;color:#2d4a2d;border-color:#b0d8b5">A</div><span>护眼</span></div>
        <div class="theme-option" data-theme="parchment" onclick="setTheme('parchment')"><div class="theme-preview" style="background:#e8dcc8;color:#4a3520;border-color:#d4c4a8">A</div><span>羊皮纸</span></div>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-label">字号 <span id="font-size-val">18</span>px</div>
      <div class="slider-row">
        <button class="step-btn" onclick="changeFontSize(-1)">A-</button>
        <input type="range" class="slider" id="font-size-slider" min="14" max="32" value="18" oninput="setFontSize(this.value)">
        <button class="step-btn" onclick="changeFontSize(1)">A+</button>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-label">行距 <span id="line-height-val">2.0</span></div>
      <div class="slider-row">
        <button class="step-btn" onclick="changeLineHeight(-0.2)">−</button>
        <input type="range" class="slider" id="line-height-slider" min="1.4" max="3.0" step="0.2" value="2.0" oninput="setLineHeight(this.value)">
        <button class="step-btn" onclick="changeLineHeight(0.2)">+</button>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-label">字体</div>
      <div class="font-options">
        <button class="font-btn active" data-font="sans" onclick="setFontFamily('sans')">黑体</button>
        <button class="font-btn" data-font="serif" onclick="setFontFamily('serif')">宋体</button>
        <button class="font-btn" data-font="kai" onclick="setFontFamily('kai')">楷体</button>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-label">翻页方式</div>
      <div class="font-options">
        <button class="font-btn active" data-mode="scroll" onclick="setReadMode('scroll')">滚动</button>
        <button class="font-btn" data-mode="click" onclick="setReadMode('click')">点击翻页</button>
      </div>
    </div>
  </div>
</div>

<!-- 本章说弹窗 -->
<div class="comment-modal" id="comment-modal">
  <div class="comment-modal-content">
    <div class="comment-modal-header">
      <h3>本章说</h3>
      <span class="comment-count" id="comment-count">0条</span>
      <button class="icon-btn" onclick="closeCommentModal()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="comment-modal-body" id="comment-modal-body"></div>
    <div class="comment-input-row">
      <input type="text" id="comment-input" placeholder="写下你的想法..." maxlength="500">
      <button onclick="submitComment()">发表</button>
    </div>
  </div>
</div>

<!-- 长按菜单 -->
<div class="context-menu" id="context-menu">
  <button onclick="contextAction('comment')">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    添加段评
  </button>
  <button onclick="contextAction('bookmark')">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    添加书签
  </button>
  <button onclick="contextAction('copy')">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    复制文字
  </button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 加载遮罩 -->
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-spinner"></div>
  <p id="loading-text">正在导入...</p>
</div>

<script src="jszip.min.js"></script>
<script src="db.js"></script>
<script src="txt-parser.js"></script>
<script src="epub-parser.js"></script>
<script src="app.js"></script>
</body>
</html>
